name: Fedora 45

env:
  FEDORA: 45
  GPG_KEY_ID: 56C464BAAC421453

on:
  push:
    tags:
      - 'fedora-45-*'
    # Pushing this branch builds the commit and publishes it as
    # fedora-45-<kernel version>-<package release> (useful when tags
    # cannot be pushed directly).
    branches:
      - 'release/fedora-45'

  repository_dispatch:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Initialize containers
        run: |
          bash ./.github/scripts/container/create.sh \
            registry.fedoraproject.org/fedora:${{ env.FEDORA }}

      - name: Install build dependencies
        run: |
          bash ./.github/scripts/container/exec.sh \
            -- \
            bash ./.github/scripts/package/fedora.sh setup-builddeps

      - name: Setup secureboot certificate
        env:
          SB_KEY: ${{ secrets.SURFACE_SB_KEY }}
          SB_CERT: ${{ secrets.SURFACE_SB_CERT }}
        run: |
          bash ./.github/scripts/container/exec.sh \
            -e SB_KEY \
            -e SB_CERT \
            -- \
            bash ./.github/scripts/package/fedora.sh setup-secureboot

      - name: Build packages
        # bash (not the default "bash -e") enables pipefail, so failures are not hidden by tee
        shell: bash
        run: |
          bash ./.github/scripts/container/exec.sh \
            -- \
            bash ./.github/scripts/package/fedora.sh build-packages 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          # Annotations are cut at ~4 KB: drop the long xtrace/flags lines,
          # shorten the rest and split the report over several annotations.
          grep -v -E '^\+ |FLAGS=' build.log | cut -c1-220 > short.log || true
          grep -n -E 'error:|Error [0-9]+|\*\*\*|undefined reference|ERROR:|FAILED|CONFLICT|patch failed|Bad exit status|No such file|fatal' short.log \
            | tail -n 30 > errors.txt || true
          { df -h / | tail -n 1; tail -n 40 short.log; } > tail.txt || true

          emit() {
            local msg
            msg=$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' "$2" | awk '{ printf "%s%%0A", $0 }')
            echo "::error title=$1::${msg}"
          }

          split -C 3300 errors.txt err_ || true
          split -C 3300 tail.txt tail_ || true
          for f in err_*; do [ -s "$f" ] && emit "Fedora ${FEDORA} build errors" "$f"; done
          for f in tail_*; do [ -s "$f" ] && emit "Fedora ${FEDORA} build log tail" "$f"; done
          exit 0

      - name: Sign packages
        env:
          GPG_KEY: ${{ secrets.LINUX_SURFACE_GPG_KEY }}
        run: |
          bash ./.github/scripts/container/exec.sh \
            -e GPG_KEY \
            -e GPG_KEY_ID \
            -- \
            bash ./.github/scripts/package/fedora.sh sign-packages

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: fedora-${{ env.FEDORA }}-latest
          path: pkg/fedora/kernel-surface/out/x86_64

  release:
    name: Publish release
    if: github.event_name == 'push'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Determine release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            script=pkg/fedora/kernel-surface/build-linux-surface.py
            version=$(sed -n 's/^PACKAGE_TAG = "kernel-\([0-9.]*\)-.*"$/\1/p' "${script}")
            release=$(sed -n 's/^PACKAGE_RELEASE = "\([0-9]*\)"$/\1/p' "${script}")
            tag="fedora-${FEDORA}-${version}-${release}"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: fedora-${{ env.FEDORA }}-latest
          path: fedora-${{ env.FEDORA }}-latest

      - name: Upload assets
        env:
          GH_TOKEN: ${{ secrets.LINUX_SURFACE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "${TAG}" -R "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release upload "${TAG}" ./*-latest/* --clobber -R "${GITHUB_REPOSITORY}"
          else
            gh release create "${TAG}" ./*-latest/* -R "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" --title "${TAG}" \
              --notes "linux-surface kernel for Fedora ${FEDORA}."
          fi

  repo:
    name: Update package repository
    if: github.repository == 'linux-surface/linux-surface'
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: fedora-${{ env.FEDORA }}-latest
          path: fedora-${{ env.FEDORA }}-latest

      - name: Initialize containers
        run: |
          bash ./.github/scripts/container/create.sh \
            registry.fedoraproject.org/fedora:${{ env.FEDORA }}

      - name: Update repository
        env:
          SURFACEBOT_TOKEN: ${{ secrets.LINUX_SURFACE_BOT_TOKEN }}
          GIT_REF: refs/tags/${{ needs.release.outputs.tag }}
          BRANCH_STAGING: u/staging
        run: |
          bash ./.github/scripts/container/exec.sh \
            -e SURFACEBOT_TOKEN \
            -e GIT_REF \
            -e BRANCH_STAGING \
            -e GITHUB_REPOSITORY \
            -- \
            bash ./.github/scripts/repository/fedora.sh ${{ env.FEDORA }}
