name: Export kernel-ark packaging

# Copies the redhat/ directory of the kernel-ark tag used by the Fedora
# package, and the kernel files touched by our patches, to the branch
# ark/<tag> of this repository. This makes the Fedora
# packaging (kernel.spec.template, config priorities) available to
# environments that can reach GitHub but not gitlab.com, e.g. for rebasing
# the patches in pkg/fedora/kernel-surface/patches onto a new kernel-ark tag.

on:
  push:
    branches:
      - 'tools/export-ark'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    name: Export redhat/ directory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Export
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(sed -n 's/^PACKAGE_TAG = "\(.*\)"$/\1/p' pkg/fedora/kernel-surface/build-linux-surface.py)
          echo "kernel-ark tag: ${tag}"

          git init -q ark
          git -C ark fetch -q --depth 1 https://gitlab.com/cki-project/kernel-ark "refs/tags/${tag}:refs/tags/${tag}"
          git -C ark checkout -q "${tag}"

          mkdir export
          cp -r ark/redhat export/
          git -C ark log -1 --format='%H %s' > export/ARK_COMMIT

          # Also export the kernel sources touched by the linux-surface
          # patches, as they are in kernel-ark (Fedora carries its own
          # changes on top of the stable release).
          version=$(echo "${tag}" | sed -E 's/^kernel-([0-9]+\.[0-9]+).*/\1/')
          grep -h '^diff --git a/' patches/${version}/*.patch | awk '{ print substr($3, 3) }' | sort -u > touched.txt
          while read -r f; do
            if [ -f "ark/${f}" ]; then
              mkdir -p "export/kernel/$(dirname "${f}")"
              cp "ark/${f}" "export/kernel/${f}"
            fi
          done < touched.txt

          cd export
          git init -q
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -q -m "kernel-ark ${tag}: redhat/"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" "HEAD:refs/heads/ark/${tag}"
